<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>解缠 Untangle</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <svg id="game" tabindex="0" aria-label="解缠画布"></svg>

      <div class="hud">
        <span class="status" id="status" aria-live="polite"></span>
        <div class="hud-actions">
          <button
            type="button"
            id="restart-hold"
            class="hud-icon"
            aria-label="长按重开本局"
            title="长按重开本局"
          >
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path
                fill="currentColor"
                d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"
              />
            </svg>
          </button>
          <button type="button" id="menu-open" class="hud-icon" aria-label="打开菜单" title="菜单">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path
                fill="currentColor"
                d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.07 7.07 0 0 0-1.63-.94l-.36-2.54A.5.5 0 0 0 13.9 2h-3.8a.5.5 0 0 0-.49.42l-.36 2.54c-.58.23-1.12.54-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.48a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94L2.83 14.58a.5.5 0 0 0-.12.64l1.92 3.32c.14.24.43.34.68.22l2.39-.96c.5.4 1.05.71 1.63.94l.36 2.54c.05.24.25.42.49.42h3.8c.24 0 .44-.18.49-.42l.36-2.54c.58-.23 1.12-.54 1.63-.94l2.39.96c.25.12.54.02.68-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"
              />
            </svg>
          </button>
        </div>
      </div>

      <div id="restart-veil" class="restart-veil" aria-hidden="true"></div>

      <div id="menu-overlay" class="menu-overlay" hidden>
        <div
          class="menu-card"
          id="menu-panel"
          role="dialog"
          aria-modal="true"
          aria-labelledby="menu-title"
        >
          <header class="menu-header">
            <h1 id="menu-title" class="menu-title">解缠</h1>
            <p class="menu-subtitle">Untangle</p>
          </header>

          <section class="menu-section" aria-labelledby="section-view">
            <h2 id="section-view" class="menu-section-title">视图</h2>
            <button type="button" id="reset-view" class="menu-btn menu-btn-block">
              重置视图
            </button>
          </section>

          <section class="menu-section" aria-labelledby="section-seed">
            <h2 id="section-seed" class="menu-section-title">种子</h2>
            <label class="menu-field" for="seed-input">
              <span class="menu-field-label">分享码</span>
              <input
                id="seed-input"
                type="text"
                spellcheck="false"
                autocomplete="off"
                autocapitalize="off"
              />
            </label>
            <div class="menu-row menu-row-split">
              <button type="button" id="copy-seed" class="menu-btn">复制</button>
              <button type="button" id="load-seed" class="menu-btn">加载</button>
            </div>
          </section>

          <section class="menu-section menu-section-deal" aria-labelledby="section-deal">
            <h2 id="section-deal" class="menu-section-title">本局</h2>
            <div class="menu-field">
              <span class="menu-field-label" id="vertex-count-label">顶点数</span>
              <div
                class="stepper"
                id="vertex-stepper"
                role="group"
                aria-labelledby="vertex-count-label"
              >
                <button type="button" id="vertex-dec" class="stepper-btn" aria-label="减少顶点数">
                  −
                </button>
                <input
                  id="vertex-count"
                  type="number"
                  min="4"
                  max="200"
                  value="8"
                  inputmode="numeric"
                  aria-labelledby="vertex-count-label"
                />
                <button type="button" id="vertex-inc" class="stepper-btn" aria-label="增加顶点数">
                  +
                </button>
              </div>
            </div>
            <button type="button" id="reroll" class="menu-btn menu-btn-block menu-btn-accent">
              随机一局
            </button>
          </section>

          <footer class="menu-footer">
            <p class="menu-hint" id="menu-hint">点击菜单外空白处返回游戏</p>
          </footer>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
